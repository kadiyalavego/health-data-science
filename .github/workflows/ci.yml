name: Clinical ML Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Ensure Synthetic Database & Directory Exist
      run: |
        mkdir -p reports
        python -c "import os; from generate_synthetic_ehr import generate_synthetic_ehr_data; generate_synthetic_ehr_data('clinical_data.db') if not os.path.exists('clinical_data.db') else None"

    - name: Execute Full Clinical Pipeline
      env:
        PYTHONPATH: .
      run: |
        python main.py

    - name: Run Clinical Unit Tests
      env:
        PYTHONPATH: .
      run: |
        python -m pytest